plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fastble.bledebugassistant'
    compileSdk 34

    defaultConfig {
        applicationId "com.fastble.bledebugassistant"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager:viewpager:1.0.0'
    // 注：布局全部用 LinearLayout/FrameLayout/ScrollView 手写，未引入 constraintlayout

    // FastBle：https://github.com/Jasonchenlijian/FastBle
    // 默认用工程内自带的兼容实现（app/src/main/java/.../blelib/BleManager.java），
    // 好处：只依赖 AndroidX/Google 仓库，云编译（GitHub Actions）必定能拉到包。
    //
    // 如果想用真正的 FastBleLib：
    //   1) 把下面这行取消注释
    //   2) 删掉 blelib 目录（否则包名不冲突但会有两份实现）
    //   3) 把 core/BleController.java 的 blelib 系列 import 改回 com.clj.fastble.*
    // implementation 'com.clj.fastble:FastBleLib:2.3.4'
}
